<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API usage documentation</title>
    <link rel="stylesheet" href="/swagger-ui/usage.css?v=1">
</head>
<body>
    <main class="usage-page">
        <p><a href="/swagger">← Back to Swagger UI</a></p>
        <header class="usage-header">
            <p class="eyebrow">API usage documentation</p>
            <h1 id="page-title">Loading endpoint documentation…</h1>
            <p id="page-description"></p>
        </header>
        <p id="page-status" role="status" aria-live="polite">Loading the OpenAPI document…</p>
        <section id="endpoint-documentation" hidden>
            <div id="endpoint-details"></div>
            <div id="endpoint-examples"></div>
        </section>
    </main>
    <script src="/swagger-ui/usage.js?v=1"></script>
</body>
</html>
